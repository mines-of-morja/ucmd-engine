[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

# Internal crates. The allowed dependency directions are listed in
# scripts/check-architecture.sh (PLAN.md §2.7, CLAUDE.md invariant 1).
[workspace.dependencies]
ucmd-core = { path = "crates/ucmd-core" }
ucmd-force = { path = "crates/ucmd-force" }
ucmd-md = { path = "crates/ucmd-md" }
ucmd-io = { path = "crates/ucmd-io" }
ucmd-providers-classical = { path = "crates/ucmd-providers-classical" }
ucmd-providers-ipi = { path = "crates/ucmd-providers-ipi" }

# External crates (versions checked 2026-11-12, docs/design/E1.md §1)
glam = "0.34"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: correctly rounded parsing, so checkpoint metadata (thermostat state,
# work, time) restores bit for bit; the default parser is off by an ulp for ~1 in 5 values
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
sha2 = "0.11"
rand = "0.10"
rand_chacha = { version = "0.10", features = ["serde"] }
libm = "0.2"
# FFT for PME (E2.4); the scalar planner keeps results machine-independent (ADR 0010)
rustfft = "6.4"
# Deterministic multithreading (E2 design §9): fixed chunks, fixed-order reductions (ADR 0010)
rayon = "1.12"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
proptest = "1"
# H5MD trajectories (ADR 0004): bundled static HDF5, no system installation needed
hdf5 = { package = "hdf5-metno", version = "0.15.1", features = ["static", "zlib"] }
ndarray = "0.17"

[workspace.lints.rust]
missing_docs = "warn" # every public item documents itself, including units
unsafe_code = "deny"

[workspace.lints.clippy]
# No unwrap/expect in library code; clippy.toml allows them inside tests.
unwrap_used = "deny"
expect_used = "deny"
