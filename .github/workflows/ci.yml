name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spec fixtures and oracle references from the umbrella repo
        uses: actions/checkout@v4
        with:
          repository: mines-of-morja/UnitcellMD
          path: _umbrella
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (contract and reference tests run when the umbrella provides spec/ and tools/oracle/)
        run: cargo test --workspace
        env:
          UCMD_SPEC_DIR: ${{ github.workspace }}/_umbrella/spec
      - name: Crate dependency rules
        run: scripts/check-architecture.sh
      - name: Build without HDF5 (ADR 0002/0004)
        run: cargo build --workspace --no-default-features
