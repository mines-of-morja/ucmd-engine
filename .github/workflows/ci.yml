name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Umbrella commit whose spec/ fixtures and tools/oracle/ references this engine is tested
  # against: spec v0.1.0 plus the E2 molecule references (umbrella branch e2). A tag or commit
  # hash, never a moving branch; it moves in the same coordinated update as the references or
  # the spec (PLAN.md §9, spec churn).
  UMBRELLA_REF: 5253d4fa3cecd13ed1a884d31adf77e33803d740

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spec fixtures and oracle references from the umbrella repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/UnitcellMD
          ref: ${{ env.UMBRELLA_REF }}
          path: _umbrella
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test, including the contract and oracle reference tests
        run: cargo test --workspace
        env:
          UCMD_SPEC_DIR: ${{ github.workspace }}/_umbrella/spec
          UCMD_REQUIRE_SPEC: "1"
      - name: Crate dependency rules
        run: scripts/check-architecture.sh
      - name: Build without HDF5 (ADR 0002/0004)
        run: cargo build --workspace --no-default-features
