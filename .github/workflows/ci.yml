name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Umbrella commit whose spec/ fixtures and tools/oracle/ references this engine is tested
  # against: spec 0.1.3 (untagged) and the oracle references of umbrella main. A tag or commit
  # hash, never a moving branch; it moves in the same coordinated update as the references or
  # the spec (PLAN.md §9, spec churn).
  UMBRELLA_REF: 0e7befca83fa1d649192e6c7475ca8b528b6692f

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spec fixtures and oracle references from the umbrella repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/UnitcellMD
          ref: ${{ env.UMBRELLA_REF }}
          path: _umbrella
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test, including the contract and oracle reference tests
        run: cargo test --workspace
        env:
          UCMD_SPEC_DIR: ${{ github.workspace }}/_umbrella/spec
          UCMD_REQUIRE_SPEC: "1"
      - name: Crate dependency rules
        run: scripts/check-architecture.sh
      - name: Build without HDF5 (ADR 0002/0004)
        run: cargo build --workspace --no-default-features

  bridge:
    # E3.7: the OpenMM bridge on OpenMM's Reference platform (no GPU in CI): the whole chain
    # `ucmd run` → conformance → ucmd-openmm, spec outputs, restarts, the integrators.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spec fixtures and validator from the umbrella repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/UnitcellMD
          ref: ${{ env.UMBRELLA_REF }}
          path: _umbrella
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build ucmd
        run: cargo build --release -p ucmd-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the bridge with OpenMM
        run: |
          python -m venv bridge/.venv
          bridge/.venv/bin/pip install -e 'bridge[openmm,dev]' _umbrella/spec/validator
      - name: Lint
        run: |
          bridge/.venv/bin/ruff check bridge
          bridge/.venv/bin/ruff format --check bridge
      - name: Test
        run: bridge/.venv/bin/pytest bridge/tests
        env:
          UCMD_SPEC_DIR: ${{ github.workspace }}/_umbrella/spec
