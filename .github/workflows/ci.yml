name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Umbrella tag whose spec/ fixtures and tools/oracle/ references this engine is tested against.
  # A spec change moves this pin in the same coordinated update (PLAN.md §9, spec churn).
  UMBRELLA_REF: spec-v0.1.0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spec fixtures and oracle references from the umbrella repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/UnitcellMD
          ref: ${{ env.UMBRELLA_REF }}
          path: _umbrella
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test, including the contract and oracle reference tests
        run: cargo test --workspace
        env:
          UCMD_SPEC_DIR: ${{ github.workspace }}/_umbrella/spec
          UCMD_REQUIRE_SPEC: "1"
      - name: Crate dependency rules
        run: scripts/check-architecture.sh
      - name: Build without HDF5 (ADR 0002/0004)
        run: cargo build --workspace --no-default-features
